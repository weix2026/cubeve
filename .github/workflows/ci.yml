name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true
    
    - name: Build all binaries
      run: make build
    
    - name: Test binary version output
      run: |
        ./bin/api-gateway --version 2>/dev/null || true
        ./bin/cubeconsole version
        ./bin/version-tool --version 2>/dev/null || true
        ./bin/instance-controller --help 2>/dev/null || true

  test-scripts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate script syntax
      run: |
        chmod +x scripts/*.sh
        bash -n scripts/build-offline.sh
        bash -n scripts/l0-install.sh
        bash -n scripts/l1-install.sh
        bash -n scripts/l2-install.sh
        bash -n scripts/l3-install.sh
        bash -n scripts/test-binaries.sh
        bash -n scripts/validate-scripts.sh

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker images
      run: make docker-build
