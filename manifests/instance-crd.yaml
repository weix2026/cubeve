apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: instances.cube.io
  labels:
    app.kubernetes.io/name: instance
    app.kubernetes.io/part-of: cubeve
spec:
  group: cube.io
  names:
    kind: Instance
    listKind: InstanceList
    plural: instances
    singular: instance
    shortNames:
    - inst
    - vm
    - ct
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - runtime
            - image
            properties:
              runtime:
                type: string
                description: "运行时类型"
                enum:
                - cube
                - kata
                - kata-clh
                - incus-lxc
                - incus-vm
                - kata-tee
              image:
                type: string
                description: "镜像引用"
              resources:
                type: object
                properties:
                  cpu:
                    type: string
                    description: "CPU 核心数或 millicores"
                    default: "2"
                  memory:
                    type: string
                    description: "内存大小"
                    default: "512Mi"
                  storage:
                    type: string
                    description: "存储大小"
                    default: "10Gi"
                  gpu:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [nvidia, amd, intel]
                      count:
                        type: integer
                        default: 1
              network:
                type: object
                properties:
                  vpc:
                    type: string
                    description: "VPC 名称"
                    default: "default"
                  subnet:
                    type: string
                    description: "子网名称"
                    default: "default"
                  securityGroups:
                    type: array
                    items:
                      type: string
                    default: ["default"]
                  publicIP:
                    type: boolean
                    default: false
              storage:
                type: object
                properties:
                  type:
                    type: string
                    enum: [virtiofs, zfs, ceph-rbd, local]
                    default: "local"
                  persistent:
                    type: boolean
                    default: true
                  snapshotPolicy:
                    type: string
                    enum: [none, hourly, daily, weekly]
                    default: "daily"
              security:
                type: object
                properties:
                  tee:
                    type: boolean
                    default: false
                  seccomp:
                    type: boolean
                    default: true
                  apparmor:
                    type: boolean
                    default: true
                  isolation:
                    type: string
                    enum: [vm, container, sandbox]
                    default: "vm"
              lifecycle:
                type: object
                properties:
                  autoStart:
                    type: boolean
                    default: true
                  autoRestart:
                    type: boolean
                    default: true
                  maxUptime:
                    type: string
                    description: "最大运行时间"
                  ephemeral:
                    type: boolean
                    default: false
          status:
            type: object
            properties:
              phase:
                type: string
                enum: [Pending, Creating, Running, Stopped, Failed, Terminating]
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
              node:
                type: string
                description: "当前运行的节点"
              runtimeHandler:
                type: string
              ip:
                type: string
              internalIP:
                type: string
              publicIP:
                type: string
              startTime:
                type: string
                format: date-time
              uptime:
                type: string
              restarts:
                type: integer
---
# Instance Controller
apiVersion: apps/v1
kind: Deployment
metadata:
  name: instance-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: instance-controller
    app.kubernetes.io/part-of: cubeve
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: instance-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: instance-controller
    spec:
      serviceAccountName: instance-controller
      containers:
      - name: controller
        image: cubeve/instance-controller:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: WATCH_NAMESPACE
          value: ""
        - name: LEADER_ELECT
          value: "true"
        - name: SYNC_INTERVAL
          value: "30s"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: instance-controller
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: instance-controller
rules:
- apiGroups: ["cube.io"]
  resources: ["instances", "instances/status", "instances/finalizers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["kubevirt.io"]
  resources: ["virtualmachines", "virtualmachineinstances", "virtualmachines/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["k8s.cni.cncf.io"]
  resources: ["network-attachment-definitions"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "services", "events", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["node.k8s.io"]
  resources: ["runtimeclasses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: instance-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: instance-controller
subjects:
- kind: ServiceAccount
  name: instance-controller
  namespace: kube-system
