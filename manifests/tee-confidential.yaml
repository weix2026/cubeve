apiVersion: v1
kind: Namespace
metadata:
  name: confidential-containers
  labels:
    app.kubernetes.io/name: confidential-containers
    app.kubernetes.io/part-of: cubeve
---
# CoCo Operator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coco-operator
  namespace: confidential-containers
  labels:
    app.kubernetes.io/name: coco-operator
    app.kubernetes.io/component: tee-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coco-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coco-operator
    spec:
      serviceAccountName: coco-operator
      containers:
      - name: operator
        image: cubeve/coco-operator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: api
          containerPort: 8080
        - name: metrics
          containerPort: 9090
        env:
        - name: TEE_TYPE
          value: "tdx"
        - name: KBS_URL
          value: "http://kbs-service:8080"
        - name: KBS_INSECURE
          value: "false"
        - name: ATTESTATION_TYPE
          value: "tdx"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: api
          initialDelaySeconds: 10
          periodSeconds: 30
---
# KBS (Key Broker Service)
apiVersion: v1
kind: Service
metadata:
  name: kbs-service
  namespace: confidential-containers
spec:
  selector:
    app.kubernetes.io/name: coco-operator
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
---
# TEE Node Labeler DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tee-node-labeler
  namespace: confidential-containers
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tee-node-labeler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tee-node-labeler
    spec:
      hostNetwork: true
      containers:
      - name: labeler
        image: cubeve/tee-node-labeler:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
---
# TEE Attestation Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: tee-attestation-config
  namespace: confidential-containers
data:
  config.yaml: |
    attestation:
      type: tdx
      # TDX 特定配置
      tdx:
        quote_generation:
          provider: in-proc
          # QGS 地址
          qgs_url: "localhost:4050"
        # 验证策略
        verification:
          policy:
            # 允许的最小 TEE 版本
            min_tee_version: "1.0"
            # 允许的 MR 测量值
            allowed_mrs: []
            # 是否检查时间
            check_time: true
            # 时间容差 (秒)
            time_tolerance: 300
      # SEV-SNP 配置
      sev:
        # ASP 地址
        asp_url: ""
        # 报告数据
        report_data: ""
      # SGX 配置
      sgx:
        # DCAP 配置
        dcap:
          pccs_url: ""
          api_key: ""
    # 密钥管理
    key_management:
      # 主密钥存储
      master_key_store: kubernetes
      # 密钥轮换间隔
      key_rotation_interval: 24h
    # 运行时策略
    runtime_policy:
      # 是否允许容器镜像
      allow_container_images: true
      # 是否允许 hostPath
      allow_host_path: false
      # 是否允许 privileged
      allow_privileged: false
---
# RuntimeClass for TEE
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-tee
handler: io.containerd.kata-tee.v2
scheduling:
  nodeSelector:
    tee-enabled: "true"
overhead:
  podFixed:
    memory: "1Gi"
    cpu: "1000m"
---
# RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coco-operator
  namespace: confidential-containers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coco-operator
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/status"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: [""]
  resources: ["pods", "pods/status", "configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["node.k8s.io"]
  resources: ["runtimeclasses"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coco-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: coco-operator
subjects:
- kind: ServiceAccount
  name: coco-operator
  namespace: confidential-containers
---
# Example TEE Instance
apiVersion: cube.io/v1
kind: Instance
metadata:
  name: tee-example
  namespace: default
spec:
  runtime: kata-tee
  image: ubuntu:24.04
  resources:
    cpu: "4"
    memory: "4Gi"
    storage: "50Gi"
  network:
    vpc: default-vpc
    subnet: default-subnet
    securityGroups:
    - default-sg
  security:
    tee: true
    isolation: vm
  lifecycle:
    autoStart: true
    autoRestart: true
    ephemeral: false
