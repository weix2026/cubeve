apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: cube
  labels:
    app.kubernetes.io/name: cube
    app.kubernetes.io/part-of: cubeve
handler: io.containerd.cube.v2
scheduling:
  nodeSelector:
    cubesandbox.io/runtime: "true"
overhead:
  podFixed:
    memory: "256Mi"
    cpu: "250m"
  podFixed:
    memory: "256Mi"
    cpu: "250m"
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
  labels:
    app.kubernetes.io/name: kata
    app.kubernetes.io/part-of: cubeve
handler: io.containerd.kata.v2
scheduling:
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
overhead:
  podFixed:
    memory: "512Mi"
